id = "shepherdr"
name = "Shepherdr"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Shows Shepherdr's spaces, coordinators and tasks as herdr workspaces and tabs"
platforms = ["linux"]

# Keeps herdr in step with herdr-core for as long as this herdr server runs.
[[startup]]
command = ["bun", "sync.ts"]

# Starts the same sync by hand, e.g. right after linking into a running server.
# It leaves when a sync already runs for this server.
[[actions]]
id = "sync"
title = "Sync Shepherdr"
contexts = ["workspace"]
command = ["bun", "sync.ts"]
